name = "telegram-crm"
compatibility_date = "2026-10-01"
main = "index.js"

# No routes or custom domains exist, so the Telegram webhook can only
# reach this Worker via telegram-crm.bitcoinfriesland.workers.dev.
workers_dev = true
preview_urls = true

[vars]
CRM_API_URL = "https://crm-api"

[[services]]
binding = "crmApi"
service = "crm-api"

[[kv_namespaces]]
binding = "SESSIONS"
id = "06abc28c5b324621a4cf7d76c1288bb8"
