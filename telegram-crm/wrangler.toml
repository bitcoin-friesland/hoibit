name = "telegram-crm"
compatibility_date = "2026-10-01"
main = "src/index.ts"

# No routes or custom domains exist, so the Telegram webhook can only
# reach this Worker via telegram-crm.bitcoinfriesland.workers.dev.
workers_dev = true
preview_urls = true

# RPC to crm-api (class CrmApi in crm-api/src/index.ts)
[[services]]
binding = "crmApi"
service = "crm-api"

# RPC to mail-to-tg: the spam button under each email (class SpamButtons in mail-to-tg/src/buttons.ts).
[[services]]
binding = "mailToTg"
service = "mail-to-tg"
entrypoint = "SpamButtons"

# One Durable Object per chat holds the chat's session (src/chat.ts).
[[durable_objects.bindings]]
name = "CHATS"
class_name = "ChatSession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatSession"]

# Workers Logs: keeps console.error output (failed Telegram calls, update errors).
[observability]
enabled = true
